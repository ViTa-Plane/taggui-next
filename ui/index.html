<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TagGUI Next - Dataset Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #121318; }
    ::-webkit-scrollbar-thumb { background: #2a2d3d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3d4259; }

    header {
      height: 52px;
      background-color: #12141c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 16px;
    }
    .text-input {
      background-color: #181a24;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 12px;
      color: #e2e8f0;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      width: 100%;
    }
    .text-input:focus { border-color: #6366f1; }

    .workspace { display: flex; flex: 1; overflow: hidden; min-height: 0; }
    aside { background-color: #12141c; display: flex; flex-direction: column; flex-shrink: 0; }
    .left-panel { width: 256px; border-right: 1px solid rgba(255, 255, 255, 0.08); }
    .right-panel { width: 320px; border-left: 1px solid rgba(255, 255, 255, 0.08); }
    main { flex: 1; display: flex; flex-direction: column; background-color: #0b0c10; min-width: 0; min-height: 0; overflow: hidden; }

    .panel-header {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid-header {
      height: 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .image-grid {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, 200px);
      gap: 16px;
      align-content: start;
      justify-content: start;
    }

    .image-card {
      position: relative;
      width: 200px;
      height: 200px;
      flex-shrink: 0;
      background-color: #0d0e12;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #27272a;
      cursor: pointer;
      transition: border-color 0.1s, box-shadow 0.1s;
    }
    .image-card:hover { border-color: #52525b; }
    .image-card.selected {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .image-card.multi-selected {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .image-card img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      display: block;
    }

    .badge-filename {
      position: absolute;
      top: 6px; left: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-family: monospace;
      color: #cbd5e1;
      max-width: 80%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }
    .badge-tagged {
      position: absolute;
      bottom: 6px; right: 6px;
      background: rgba(16, 185, 129, 0.9);
      color: #000;
      font-weight: bold;
      font-size: 8px;
      padding: 2px 5px;
      border-radius: 4px;
      pointer-events: none;
    }
    .badge-delete {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(239, 68, 68, 0.85);
      color: #fff;
      font-weight: bold;
      font-size: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background-color 0.15s;
      z-index: 10;
    }
    .image-card:hover .badge-delete { opacity: 1; }
    .badge-delete:hover { background: rgba(220, 38, 38, 1); }

    .container-pad { padding: 12px; }
    .tags-container { padding: 12px; overflow-y: auto; flex: 1; min-height: 0; }
    .tag-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag-chip {
      background-color: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: monospace;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .tag-chip span { cursor: pointer; color: #818cf8; }
    .tag-chip span:hover { color: #f87171; }

    .autocomplete-box {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: #181a24;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      margin-top: 4px;
      max-height: 150px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    .autocomplete-item {
      padding: 6px 10px;
      font-size: 11px;
      font-family: monospace;
      cursor: pointer;
      color: #cbd5e1;
    }
    .autocomplete-item:hover, .autocomplete-item.active {
      background: rgba(99, 102, 241, 0.25);
      color: #fff;
    }

    .token-box {
      background-color: #181a24;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 12px;
    }

    /* Modal Overlay Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background-color: #12141c;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      width: 380px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; overflow: hidden;">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #4f46e5, #7c3aed); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0;">T</div>
      <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; overflow: hidden;">
        <h1 style="font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px;">
          TagGUI <span style="font-size: 9px; background: rgba(99,102,241,0.2); color: #818cf8; padding: 1px 5px; border-radius: 4px; font-family: monospace; border: 1px solid rgba(99,102,241,0.3);">NEXT</span>
        </h1>
        <div style="display: flex; align-items: center; gap: 8px; min-width: 0; width: 100%;">
          <p id="dataset-path-label" title="Dataset Path" style="font-size: 10px; color: #94a3b8; font-family: monospace; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left;">Loading...</p>
          <button onclick="browseFolder()" style="background: #181a24; border: 1px solid rgba(255,255,255,0.1); color: #a5b4fc; font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer; flex-shrink: 0;">Open Dataset</button>
          <button onclick="openSettingsModal()" title="Configure Interrogator Settings" style="background: #181a24; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer; flex-shrink: 0;">⚙️ Settings</button>
          <button onclick="backend && backend.openExternalUrl('https://github.com/ViTa-Plane/taggui-next')" title="View source on GitHub" style="background: #181a24; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer; flex-shrink: 0;">⭐ GitHub</button>
        </div>
      </div>
    </div>

    <div style="width: 100%; max-width: 350px; position: relative; display: flex; align-items: center; background-color: #181a24; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding-right: 8px; flex-shrink: 0;">
      <input id="filter-input" type="text" aria-label="Filter dataset" placeholder='Filter (name or tag, e.g. cat), Ctrl+F...' oninput="onFilterInputChanged()" style="flex: 1; background: transparent; border: none; padding: 6px 12px; color: #e2e8f0; font-size: 12px; font-family: monospace; outline: none;" />
      <button id="clear-filter-btn" onclick="clearFilter()" title="Clear filter" style="background: none; border: none; color: #64748b; font-size: 14px; font-weight: bold; cursor: pointer; display: none; padding: 0 6px; align-items: center; justify-content: center;">×</button>
      <div style="font-size: 10px; color: #94a3b8; background: #12141c; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.08); margin-left: 6px; pointer-events: none; white-space: nowrap;">
        <span id="image-count">0</span> / <span id="total-count">0</span>
      </div>
    </div>
  </header>

  <div class="workspace">
    <aside class="left-panel">
      <div class="panel-header"><span>Dataset Tags</span></div>
      <div id="global-tags-list" class="tags-container"></div>
    </aside>

    <main>
      <div class="grid-header">
        <span id="selection-status">Grid View (Arrow keys to navigate, Shift+Click for multi-select)</span>
        <div style="display: flex; gap: 8px; align-items: center;">
          <span id="selection-counter" style="font-family: monospace; font-size: 11px; color: #38bdf8; margin-right: 8px;">0 / 0 selected</span>
          <button onclick="selectAllFiltered()" style="background: #181a24; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer;">Select All</button>
          <button onclick="clearMultiSelection()" style="background: #181a24; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer;">Clear Selection</button>
        </div>
      </div>
      <div id="image-grid" class="image-grid"></div>
    </main>

    <aside class="right-panel">
      <div class="panel-header">
        <span>Selected Image</span>
        <span id="selected-filename" style="font-size: 10px; color: #64748b; font-family: monospace; font-weight: normal;">No image selected</span>
      </div>

      <div class="container-pad" style="border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: relative;">
        <input id="tag-input" type="text" aria-label="Add tag input" placeholder="Add tag... (Press Enter)" class="text-input" autocomplete="off" />
        <div id="autocomplete-box" class="autocomplete-box"></div>
      </div>

      <div class="container-pad" style="border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
        <input id="keywords-input" type="text" aria-label="Dataset training keywords" placeholder="Keywords (comma-separated, prepends)..." class="text-input" autocomplete="off" />
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
          <span style="font-size: 9px; color: #64748b; font-family: monospace;">Prepends & sorts</span>
          <div style="display: flex; gap: 6px;">
            <button onclick="applyKeywordsToSelectionBtn()" title="Apply keywords to current selection (Enter)" style="background: #181a24; border: 1px solid rgba(255,255,255,0.1); color: #a5b4fc; font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer;">Apply</button>
            <button onclick="applyKeywordsToAll()" title="Apply keywords to all pictures in dataset" style="background: #181a24; border: 1px solid rgba(255,255,255,0.1); color: #38bdf8; font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer;">Apply to All</button>
          </div>
        </div>
      </div>

      <div class="tags-container">
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span id="active-tag-count" style="font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase;">Tags (0)</span>
            <button onclick="triggerAutoTag()" title="Generate tags using local PyTorch Tagger" style="background: linear-gradient(135deg, #4f46e5, #7c3aed); border: none; color: white; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 4px; cursor: pointer;">✨ AutoTag</button>
          </div>
          <div id="active-tags-container" class="tag-chips"></div>
        </div>

        <div class="token-box">
          <div style="display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 6px;">
            <span>Estimated Token Context</span>
            <span id="token-label" style="font-family: monospace; color: #818cf8;">0 / 75</span>
          </div>
          <div style="width: 100%; background-color: #0b0c10; height: 6px; border-radius: 9999px; overflow: hidden;">
            <div id="token-progress" style="background-color: #6366f1; height: 100%; width: 0%; transition: width 0.2s, background-color 0.2s;"></div>
          </div>
        </div>

        <div class="token-box">
          <div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">Sort Tags</div>
          <div style="display: flex; gap: 6px;">
            <button onclick="sortActiveTags('alpha')" title="Sort active tags alphabetically (ignoring keywords)" style="flex: 1; background: #12141c; border: 1px solid rgba(255,255,255,0.1); color: #a5b4fc; font-size: 10px; padding: 6px; border-radius: 4px; cursor: pointer;">Sort A-Z</button>
            <button onclick="sortActiveTags('freq')" title="Sort active tags by frequency in dataset (ignoring keywords)" style="flex: 1; background: #12141c; border: 1px solid rgba(255,255,255,0.1); color: #38bdf8; font-size: 10px; padding: 6px; border-radius: 4px; cursor: pointer;">Sort by Frequency</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Settings Modal Dialog -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 13px; font-weight: bold; color: #e2e8f0; text-transform: uppercase; letter-spacing: 0.05em;">Interrogator Settings</h2>
        <button onclick="closeSettingsModal()" style="background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer;">×</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div>
          <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">General Threshold (0.0 - 1.0)</label>
          <input id="setting-general-threshold" type="number" step="0.05" min="0" max="1" class="text-input" />
        </div>
        <div>
          <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">Character Threshold (0.0 - 1.0)</label>
          <input id="setting-character-threshold" type="number" step="0.05" min="0" max="1" class="text-input" />
        </div>
        <div>
          <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">AutoTag Mode</label>
          <select id="setting-tag-strategy" class="text-input" style="background-color: #181a24; color: #e2e8f0; cursor: pointer;">
            <option value="add">Add to existing tags</option>
            <option value="replace">Replace existing tags (keep keywords)</option>
          </select>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
        <button onclick="closeSettingsModal()" style="background: #181a24; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-size: 11px; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Cancel</button>
        <button onclick="saveSettingsModal()" style="background: #6366f1; border: none; color: white; font-size: 11px; font-weight: bold; padding: 6px 14px; border-radius: 6px; cursor: pointer;">Save Settings</button>
      </div>
    </div>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    let backend = null;
    let datasetImages = [];
    let filteredImages = [];
    let selectedImageIndex = null;
    let multiSelectedIndices = new Set();
    let lastClickedIndex = null;
    let keywordsInput = null;
    let selectedLeftTag = null;

    let undoStack = [];
    let redoStack = [];
    const MAX_HISTORY = 50;

    let currentSettingsData = {
        keywords: "",
        general_threshold: 0.35,
        character_threshold: 0.85,
        tag_strategy: "add"
    };

    // --- Global Settings Modal Handlers ---
    function openSettingsModal() {
        if (backend) {
            backend.getDatasetSettings(function(settingsRes) {
                try {
                    currentSettingsData = JSON.parse(settingsRes);
                } catch(e) {}
                document.getElementById('setting-general-threshold').value = currentSettingsData.general_threshold ?? 0.35;
                document.getElementById('setting-character-threshold').value = currentSettingsData.character_threshold ?? 0.85;
                document.getElementById('setting-tag-strategy').value = currentSettingsData.tag_strategy ?? "add";
                document.getElementById('settings-modal').style.display = 'flex';
            });
        }
    }

    function closeSettingsModal() {
        document.getElementById('settings-modal').style.display = 'none';
    }

    function saveSettingsModal() {
        const genVal = parseFloat(document.getElementById('setting-general-threshold').value);
        const charVal = parseFloat(document.getElementById('setting-character-threshold').value);
        const stratVal = document.getElementById('setting-tag-strategy').value;

        currentSettingsData.general_threshold = isNaN(genVal) ? 0.35 : genVal;
        currentSettingsData.character_threshold = isNaN(charVal) ? 0.85 : charVal;
        currentSettingsData.tag_strategy = stratVal;
        if (keywordsInput) currentSettingsData.keywords = keywordsInput.value;

        if (backend) {
            backend.saveDatasetSettings(JSON.stringify(currentSettingsData));
        }
        closeSettingsModal();
    }

    function cleanImageTags(tags) {
        if (!Array.isArray(tags)) return [];
        const seen = new Set();
        return tags.filter(tag => {
            const trimmed = tag.trim();
            const lower = trimmed.toLowerCase();
            if (!lower) return false;
            if (seen.has(lower)) return false;
            seen.add(lower);
            return true;
        });
    }

    function addTagToImage(img, tag) {
        const trimmed = tag.trim();
        if (!trimmed) return false;
        const lower = trimmed.toLowerCase();
        const exists = img.tags.some(t => t.trim().toLowerCase() === lower);
        if (!exists) {
            img.tags.push(trimmed);
            return true;
        }
        return false;
    }

    function browseFolder() {
        if (!backend) return;
        backend.browseDatasetFolder(function(response) {
            if (!response) return;
            datasetImages = JSON.parse(response);
            datasetImages.forEach(img => {
                img.tags = cleanImageTags(img.tags);
            });
            filteredImages = [...datasetImages];
            document.getElementById('image-grid').innerHTML = '';
            selectedImageIndex = null;
            multiSelectedIndices.clear();
            selectedLeftTag = null;
            undoStack = [];

            backend.getDatasetSettings(function(settingsRes) {
                try {
                    currentSettingsData = JSON.parse(settingsRes);
                    if (keywordsInput) keywordsInput.value = currentSettingsData.keywords || "";
                } catch(e) {
                    currentSettingsData = { keywords: "", general_threshold: 0.35, character_threshold: 0.85, tag_strategy: "add" };
                    if (keywordsInput) keywordsInput.value = "";
                }
                updateDatasetUI();
            });
        });
    }

    function fetchDataset() {
        if (!backend) return;
        backend.getDatasetImages(function(response) {
            datasetImages = JSON.parse(response);
            datasetImages.forEach(img => {
                img.tags = cleanImageTags(img.tags);
            });
            filteredImages = [...datasetImages];

            backend.getDatasetSettings(function(settingsRes) {
                try {
                    currentSettingsData = JSON.parse(settingsRes);
                    if (keywordsInput) keywordsInput.value = currentSettingsData.keywords || "";
                } catch(e) {
                    currentSettingsData = { keywords: "", general_threshold: 0.35, character_threshold: 0.85, tag_strategy: "add" };
                    if (keywordsInput) keywordsInput.value = "";
                }
                updateDatasetUI();
            });
        });
    }

    function pushUndoState() {
        const snapshot = {
            images: datasetImages.map(img => ({
                relative_path: img.relative_path,
                tags: [...img.tags]
            })),
            keywords: keywordsInput ? keywordsInput.value : "",
            selectedImageIndex: selectedImageIndex
        };
        undoStack.push(snapshot);
        if (undoStack.length > MAX_HISTORY) undoStack.shift();
        redoStack = [];
    }

    function performUndo() {
        if (undoStack.length === 0) return;
        const currentState = {
            images: datasetImages.map(img => ({
                relative_path: img.relative_path,
                tags: [...img.tags]
            })),
            keywords: keywordsInput ? keywordsInput.value : "",
            selectedImageIndex: selectedImageIndex
        };
        redoStack.push(currentState);
        applyState(undoStack.pop());
    }

    function performRedo() {
        if (redoStack.length === 0) return;
        const currentState = {
            images: datasetImages.map(img => ({
                relative_path: img.relative_path,
                tags: [...img.tags]
            })),
            keywords: keywordsInput ? keywordsInput.value : "",
            selectedImageIndex: selectedImageIndex
        };
        undoStack.push(currentState);
        applyState(redoStack.pop());
    }

    function applyState(targetState) {
        const batchUpdates = {};
        let currentSelectedPath = null;
        if (selectedImageIndex !== null && datasetImages[selectedImageIndex]) {
            currentSelectedPath = datasetImages[selectedImageIndex].relative_path;
        }

        const currentPaths = new Set(datasetImages.map(img => img.relative_path));
        const missingPaths = targetState.images.filter(prevImg => !currentPaths.has(prevImg.relative_path));

        if (missingPaths.length > 0) {
            missingPaths.forEach(prevImg => {
                if (backend) backend.restoreImageAndTags(prevImg.relative_path);
            });
            targetState.images.forEach(prevImg => {
                batchUpdates[prevImg.relative_path] = prevImg.tags.join(', ');
            });
            if (keywordsInput) keywordsInput.value = targetState.keywords;
            if (backend) {
                backend.saveBatchImageTags(JSON.stringify(batchUpdates));
                if (keywordsInput) {
                    currentSettingsData.keywords = keywordsInput.value;
                    backend.saveDatasetSettings(JSON.stringify(currentSettingsData));
                }
            }
            backend.getDatasetImages(function(response) {
                datasetImages = JSON.parse(response);
                datasetImages.forEach(img => img.tags = cleanImageTags(img.tags));
                applyFilter();
            });
        } else {
            targetState.images.forEach(prevImg => {
                const img = datasetImages.find(i => i.relative_path === prevImg.relative_path);
                if (img) {
                    img.tags = cleanImageTags([...prevImg.tags]);
                    batchUpdates[prevImg.relative_path] = img.tags.join(', ');
                }
            });
            if (keywordsInput) keywordsInput.value = targetState.keywords;
            if (backend) {
                backend.saveBatchImageTags(JSON.stringify(batchUpdates));
                if (keywordsInput) {
                    currentSettingsData.keywords = keywordsInput.value;
                    backend.saveDatasetSettings(JSON.stringify(currentSettingsData));
                }
            }
            applyFilter();
        }
    }

    new QWebChannel(qt.webChannelTransport, function(channel) {
        backend = channel.objects.backend;
        keywordsInput = document.getElementById('keywords-input');

        if (keywordsInput) {
            keywordsInput.addEventListener('input', function() {

                }
            });

            keywordsInput.addEventListener('keydown', function(e) {

    function updateDatasetUI() {
        document.getElementById('total-count').innerText = datasetImages.length;
        document.getElementById('image-count').innerText = filteredImages.length;

        let rawPath = "";
        if (backend) {

    function onFilterInputChanged() {
        const input = document.getElementById('filter-input');
        const clearBtn = document.getElementById('clear-filter-btn');
        if (clearBtn) clearBtn.style.display = input.value.trim().length > 0 ? 'flex' : 'none';

    function clearFilter() {
        const input = document.getElementById('filter-input');
        input.value = '';
        document.getElementById('clear-filter-btn').style.display = 'none';
        applyFilter();
        input.focus();
    }

    function applyFilter() {
        const query = document.getElementById('filter-input').value.trim().toLowerCase();
        if (!query) filteredImages = [...datasetImages];
        else if (query === 'untagged') filteredImages = datasetImages.filter(img => img.tags.length === 0);
        else {
            filteredImages = datasetImages.filter(img =>
                img.filename.toLowerCase().includes(query) ||
                img.tags.some(t => t.toLowerCase().includes(query))
            );
        }
        document.getElementById('image-count').innerText = filteredImages.length;
        document.getElementById('image-grid').innerHTML = '';
        renderGlobalTagsList();
        multiSelectedIndices.clear();
        if (filteredImages.length > 0) {
            selectImage(datasetImages.indexOf(filteredImages[0]), true);
        } else {
            selectedImageIndex = null;
            document.getElementById('selected-filename').innerText = "No image found";
            document.getElementById('active-tags-container').innerHTML = '';
            document.getElementById('active-tag-count').innerText = "Tags (0)";
        }
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('image-grid');
        grid.innerHTML = '';

        filteredImages.forEach((img) => {
            const originalIdx = datasetImages.indexOf(img);
            const isSelected = selectedImageIndex === originalIdx;
            const isMultiSelected = multiSelectedIndices.has(originalIdx);
            const hasTags = img.tags.length > 0;

            const card = document.createElement('div');
            card.className = `image-card ${isSelected ? 'selected' : ''} ${isMultiSelected ? 'multi-selected' : ''}`;
            card.dataset.index = originalIdx;

            card.innerHTML = `
                <img src="${img.url}" loading="lazy" onerror="this.style.display='none'" />
                <div class="badge-filename">${img.filename}</div>
                <div class="badge-tagged" style="display: ${hasTags ? 'block' : 'none'};">TAGGED</div>
                <div class="badge-delete" title="Delete image & tags" onclick="promptDeleteImage(event, ${originalIdx})">×</div>
            `;

            card.onclick = (e) => {
                if (e.shiftKey && lastClickedIndex !== null) {
                    const start = Math.min(lastClickedIndex, originalIdx);
                    const end = Math.max(lastClickedIndex, originalIdx);
                    for (let i = start; i <= end; i++) multiSelectedIndices.add(i);
                } else if (e.ctrlKey || e.metaKey) {
                    if (multiSelectedIndices.has(originalIdx)) multiSelectedIndices.delete(originalIdx);
                    else multiSelectedIndices.add(originalIdx);
                } else {
                    multiSelectedIndices.clear();
                    selectImage(originalIdx, true);
                }
                lastClickedIndex = originalIdx;
                updateGridSelectionUI();
            };
            grid.appendChild(card);
        });
        updateSelectionStatusText();
    }

    function promptDeleteImage(event, originalIdx) {
        event.stopPropagation();
        const img = datasetImages[originalIdx];
        if (!img || !confirm(`Delete "${img.filename}" and its .txt tags file?`)) return;

        pushUndoState();
        if (backend) backend.deleteImageAndTags(img.relative_path);
        datasetImages.splice(originalIdx, 1);
        applyFilter();
    }

    function selectImage(idx, updateUI = true) {
        selectedImageIndex = idx;

    function updateGridSelectionUI() {
        const grid = document.getElementById('image-grid');
        Array.from(grid.children).forEach(card => {
            const idx = parseInt(card.dataset.index);
            card.classList.toggle('selected', idx === selectedImageIndex);

    function updateSelectionStatusText() {

    function clearMultiSelection() {

    function selectAllFiltered() {

        multiSelectedIndices.clear();
        selectedImageIndex = datasetImages.indexOf(filteredImages[0]);

    function deleteTagGlobally(tagToDelete) {
        if (!tagToDelete) return;
        pushUndoState();
        const updates = {};
        datasetImages.forEach(img => {
            const initialLen = img.tags.length;
            img.tags = img.tags.filter(t => t.toLowerCase() !== tagToDelete.toLowerCase());
            if (img.tags.length !== initialLen) {
                updates[img.relative_path] = img.tags.join(', ');
            }
        });
        if (backend && Object.keys(updates).length > 0) {
            backend.saveBatchImageTags(JSON.stringify(updates));
        }
        selectedLeftTag = null;
        renderGlobalTagsList();
        renderActiveTags();
        renderGrid();
    }

    function renderGlobalTagsList() {
        const container = document.getElementById('global-tags-list');
        if (!container) return;
        container.innerHTML = '';

        const currentQuery = document.getElementById('filter-input').value.trim().toLowerCase();
        const activeKeywords = keywordsInput ? keywordsInput.value.split(',').map(k => k.trim().toLowerCase()).filter(k => k.length > 0) : [];

        const tagCounts = {};
        datasetImages.forEach(img => img.tags.forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
        const sortedTags = Object.entries(tagCounts).sort((a,b) => b[1] - a[1]);
        let firstMatchNode = null;

        sortedTags.forEach(([tag, count]) => {
            const isHighlighted = currentQuery && tag.toLowerCase().includes(currentQuery);
            const isKeyword = activeKeywords.includes(tag.toLowerCase());
            const isSelected = selectedLeftTag && selectedLeftTag.toLowerCase() === tag.toLowerCase();

            const item = document.createElement('div');
            item.title = "Click: Select & Filter | Delete: Remove from all images | Ctrl+Click: Add Keyword | Shift+Click: Add to Selection";
            item.style.cssText = `
                display: flex;
                justify-content: space-between;
                font-size: 11px;
                font-family: monospace;
                padding: 4px 6px;
                cursor: pointer;
                border-radius: 4px;
                color: ${isSelected ? '#ffffff' : (isHighlighted ? '#ffffff' : '#cbd5e1')};
                background: ${isSelected ? 'rgba(56, 189, 248, 0.3)' : (isHighlighted ? 'rgba(99, 102, 241, 0.25)' : 'transparent')};
                border-left: ${isSelected ? '2px solid #38bdf8' : (isKeyword ? '2px solid #10b981' : (isHighlighted ? '2px solid #6366f1' : 'none'))};
            `;
            item.innerHTML = `<span>${tag}</span> <span style="color: #64748b;">${count}</span>`;

            // Double-Click to Rename Globally
            item.ondblclick = (e) => {
                e.stopPropagation();
                const newTagVal = prompt(`Rename tag "${tag}" globally across all images:`, tag);
                if (newTagVal === null) return;
                const trimmedNew = newTagVal.trim().toLowerCase();
                if (!trimmedNew || trimmedNew === tag.toLowerCase()) return;

                pushUndoState();
                const updates = {};
                datasetImages.forEach(img => {
                    let changed = false;
                    img.tags = img.tags.map(t => {
                        if (t.toLowerCase() === tag.toLowerCase()) {
                            changed = true;
                            return trimmedNew;
                        }
                        return t;
                    });
                    if (changed) {
                        img.tags = cleanImageTags(img.tags);
                        updates[img.relative_path] = img.tags.join(', ');
                    }
                });

                if (backend && Object.keys(updates).length > 0) {
                    backend.saveBatchImageTags(JSON.stringify(updates));
                }
                selectedLeftTag = trimmedNew;
                renderGlobalTagsList();
                renderActiveTags();
                renderGrid();
            };

            item.onclick = (e) => {
                if ((e.ctrlKey || e.metaKey) && e.altKey) {
                    removeFromKeywords(tag);
                    e.stopPropagation();
                } else if (e.ctrlKey || e.metaKey) {
                    addToKeywords(tag);
                    e.stopPropagation();
                } else if (e.shiftKey && e.altKey) {
                    pushUndoState();
                    const targets = [selectedImageIndex, ...Array.from(multiSelectedIndices)].filter(idx => idx !== null);
                    const updates = {};
                    targets.forEach(idx => {
                        const img = datasetImages[idx];
                        img.tags = img.tags.filter(t => t.toLowerCase() !== tag.toLowerCase());
                        updates[img.relative_path] = img.tags.join(', ');
                    });
                    if (backend && targets.length > 0) backend.saveBatchImageTags(JSON.stringify(updates));
                    renderActiveTags();
                    renderGlobalTagsList();
                    renderGrid();
                    e.stopPropagation();
                } else if (e.shiftKey) {
                    pushUndoState();
                    const targets = [selectedImageIndex, ...Array.from(multiSelectedIndices)].filter(idx => idx !== null);
                    const updates = {};
                    targets.forEach(idx => {
                        const img = datasetImages[idx];
                        addTagToImage(img, tag);
                        updates[img.relative_path] = img.tags.join(', ');
                    });
                    if (backend && targets.length > 0) backend.saveBatchImageTags(JSON.stringify(updates));
                    renderActiveTags();
                    renderGlobalTagsList();
                    renderGrid();
                    e.stopPropagation();
                } else {
                    selectedLeftTag = tag;
                    document.getElementById('filter-input').value = tag;
                    onFilterInputChanged();
                    renderGlobalTagsList();
                }
            };

            container.appendChild(item);
            if (isHighlighted && !firstMatchNode) firstMatchNode = item;
        });

        if (firstMatchNode) {
            firstMatchNode.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    function renderActiveTags() {
        if (selectedImageIndex === null) return;
        const img = datasetImages[selectedImageIndex];
        const container = document.getElementById('active-tags-container');
        if (!container) return;
        container.innerHTML = '';

        document.getElementById('active-tag-count').innerText = `Tags (${img.tags.length})`;
        const currentQuery = document.getElementById('filter-input').value.trim().toLowerCase();
        const activeKeywords = keywordsInput ? keywordsInput.value.split(',').map(k => k.trim().toLowerCase()).filter(k => k.length > 0) : [];

        let dropIndicator = document.getElementById('tag-drop-indicator');
        if (!dropIndicator) {
            dropIndicator = document.createElement('div');
            dropIndicator.id = 'tag-drop-indicator';
            dropIndicator.style.cssText = `width: 3px; background-color: #38bdf8; box-shadow: 0 0 8px #38bdf8; border-radius: 2px; margin: 0 2px; pointer-events: none; display: none;`;
        }

        let targetDropIdx = null;

        container.ondragover = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const chips = Array.from(container.querySelectorAll('.tag-chip'));
            if (chips.length === 0) return;

            let closestChip = null;
            let closestDistance = Infinity;
            let insertBefore = true;

            chips.forEach(chip => {
                const rect = chip.getBoundingClientRect();
                const midX = rect.left + rect.width / 2;
                const midY = rect.top + rect.height / 2;
                const dist = Math.hypot(e.clientX - midX, e.clientY - midY);
                if (dist < closestDistance) {
                    closestDistance = dist;
                    closestChip = chip;
                    insertBefore = e.clientX < midX;
                }
            });

            if (closestChip) {
                dropIndicator.style.display = 'inline-block';
                dropIndicator.style.height = `${closestChip.offsetHeight || 22}px`;
                const idx = parseInt(closestChip.dataset.index);
                if (insertBefore) {
                    container.insertBefore(dropIndicator, closestChip);
                    targetDropIdx = idx;
                } else {
                    container.insertBefore(dropIndicator, closestChip.nextSibling);
                    targetDropIdx = idx + 1;
                }
            }
        };

        container.ondrop = (e) => {
            e.preventDefault();
            const fromIdxStr = e.dataTransfer.getData('text/plain');
            if (!fromIdxStr && fromIdxStr !== "0") return;
            const fromIdx = parseInt(fromIdxStr);
            let toIdx = targetDropIdx;

            if (dropIndicator.parentNode) dropIndicator.parentNode.removeChild(dropIndicator);
            dropIndicator.style.display = 'none';

            if (toIdx === null || isNaN(fromIdx)) return;
            if (fromIdx < toIdx) toIdx--;
            if (fromIdx === toIdx) return;

            pushUndoState();
            const movedTag = img.tags.splice(fromIdx, 1)[0];
            img.tags.splice(toIdx, 0, movedTag);

            if (backend) backend.saveImageTags(img.relative_path, img.tags.join(', '));
            renderActiveTags();
            renderGlobalTagsList();
            renderGrid();
        };

        img.tags.forEach((tag, tagIdx) => {
            const isKeyword = activeKeywords.includes(tag.toLowerCase());
            const isSearchMatch = currentQuery && tag.toLowerCase().includes(currentQuery);

            const chip = document.createElement('span');
            chip.className = 'tag-chip';
            chip.draggable = true;
            chip.dataset.index = tagIdx;
            chip.title = "Drag to reorder | Ctrl+Click: Add to Keywords";

            if (isKeyword) {
                chip.style.borderColor = '#10b981';
                chip.style.backgroundColor = 'rgba(16, 185, 129, 0.25)';
                chip.style.color = '#34d399';
            } else if (isSearchMatch) {
                chip.style.borderColor = '#38bdf8';
                chip.style.backgroundColor = 'rgba(56, 189, 248, 0.25)';
                chip.style.color = '#ffffff';
            }

            chip.innerHTML = `${tag} <span title="Remove tag">×</span>`;

            chip.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                const newTagVal = prompt("Edit tag:", tag);
                if (newTagVal === null) return;
                const trimmedNew = newTagVal.trim().toLowerCase();
                if (!trimmedNew || trimmedNew === tag.toLowerCase()) return;

                pushUndoState();
                img.tags[tagIdx] = trimmedNew;
                img.tags = cleanImageTags(img.tags);
                if (backend) backend.saveImageTags(img.relative_path, img.tags.join(', '));
                renderActiveTags();
                renderGlobalTagsList();
                renderGrid();
            });

            chip.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', tagIdx.toString());
                e.dataTransfer.effectAllowed = 'move';
                chip.style.opacity = '0.3';
            });

            chip.addEventListener('dragend', () => {
                chip.style.opacity = '1';
                if (dropIndicator.parentNode) dropIndicator.parentNode.removeChild(dropIndicator);
                dropIndicator.style.display = 'none';
            });

            chip.onclick = (e) => {
                if ((e.ctrlKey || e.metaKey) && e.altKey) removeFromKeywords(tag);
                else if (e.ctrlKey || e.metaKey) addToKeywords(tag);
                e.stopPropagation();
            };

            chip.querySelector('span').onclick = (e) => {
                e.stopPropagation();
                pushUndoState();
                img.tags = img.tags.filter(t => t !== tag);
                if (backend) backend.saveImageTags(img.relative_path, img.tags.join(', '));
                renderActiveTags();
                renderGlobalTagsList();
                renderGrid();
            };

            container.appendChild(chip);
        });

        updateTokenDisplay(img.tags.join(', '));
    }

    function sortActiveTags(method) {
        if (selectedImageIndex === null) return;
        const img = datasetImages[selectedImageIndex];
        if (!img || img.tags.length <= 1) return;

        pushUndoState();
        const activeKeywords = keywordsInput ? keywordsInput.value.split(',').map(k => k.trim().toLowerCase()).filter(k => k.length > 0) : [];
        const keywordTags = [];
        const standardTags = [];

        img.tags.forEach(tag => {
            if (activeKeywords.includes(tag.toLowerCase())) keywordTags.push(tag);
            else standardTags.push(tag);
        });

        if (method === 'alpha') {
            standardTags.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'accent' }));
        } else if (method === 'freq') {
            const globalCounts = {};
            datasetImages.forEach(dImg => dImg.tags.forEach(t => globalCounts[t.toLowerCase()] = (globalCounts[t.toLowerCase()] || 0) + 1));
            standardTags.sort((a, b) => (globalCounts[b.toLowerCase()] || 0) - (globalCounts[a.toLowerCase()] || 0) || a.localeCompare(b));
        }

        img.tags = [...keywordTags, ...standardTags];
        if (backend) backend.saveImageTags(img.relative_path, img.tags.join(', '));
        renderActiveTags();
        renderGlobalTagsList();
        renderGrid();
    }

    function addTagToSelection(newTag) {
        if (!newTag || selectedImageIndex === null) return;
        pushUndoState();
        const targets = [selectedImageIndex, ...Array.from(multiSelectedIndices)];
        const updates = {};
        targets.forEach(idx => {
            const img = datasetImages[idx];
            addTagToImage(img, newTag);
            updates[img.relative_path] = img.tags.join(', ');
        });
        if (backend) backend.saveBatchImageTags(JSON.stringify(updates));
        renderActiveTags();
        renderGlobalTagsList();
        renderGrid();
    }

    function addToKeywords(tag) {
        if (!keywordsInput) return;
        pushUndoState();
        const currentVal = keywordsInput.value.trim();
        let keywordsList = currentVal ? currentVal.split(',').map(k => k.trim()).filter(k => k.length > 0) : [];
        if (!keywordsList.map(k => k.toLowerCase()).includes(tag.toLowerCase())) {
            keywordsList.push(tag);
            keywordsInput.value = keywordsList.join(', ');
            renderActiveTags();
            renderGlobalTagsList();
            if (backend) {
                currentSettingsData.keywords = keywordsInput.value;
                backend.saveDatasetSettings(JSON.stringify(currentSettingsData));
            }
        }
    }

    function removeFromKeywords(tag) {
        if (!keywordsInput) return;
        const currentVal = keywordsInput.value.trim();
        if (!currentVal) return;
        pushUndoState();
        let keywordsList = currentVal.split(',').map(k => k.trim()).filter(k => k.length > 0);
        const updatedList = keywordsList.filter(k => k.toLowerCase() !== tag.toLowerCase());
        if (updatedList.length !== keywordsList.length) {
            keywordsInput.value = updatedList.join(', ');
            renderActiveTags();
            renderGlobalTagsList();
            if (backend) {
                currentSettingsData.keywords = keywordsInput.value;
                backend.saveDatasetSettings(JSON.stringify(currentSettingsData));
            }
        }
    }

    function updateTokenDisplay(tagsString) {
        if (!backend) return;
        backend.estimateTokens(tagsString, function(count) {
            document.getElementById('token-label').innerText = `${count} / 75`;
            const pct = Math.min((count / 75) * 100, 100);
            const bar = document.getElementById('token-progress');
            bar.style.width = `${pct}%`;
            bar.style.backgroundColor = count > 75 ? '#ef4444' : '#6366f1';
        });
    }

    function applyKeywordsToSelectionBtn() {
        if (!keywordsInput) return;
        const val = keywordsInput.value.trim();
        if (val && selectedImageIndex !== null) applyKeywordsToSelection(val);
    }

    function applyKeywordsToSelection(keywordsStr) {
        if (!keywordsStr || selectedImageIndex === null) return;
        const rawKeywords = keywordsStr.split(',').map(k => k.trim().toLowerCase()).filter(k => k.length > 0);
        if (rawKeywords.length === 0) return;

        pushUndoState();
        const targets = [selectedImageIndex, ...Array.from(multiSelectedIndices)];
        const updates = {};
        targets.forEach(idx => {
            const img = datasetImages[idx];
            const remainingTags = img.tags.filter(t => !rawKeywords.includes(t.toLowerCase()));
            img.tags = [...rawKeywords, ...remainingTags];
            updates[img.relative_path] = img.tags.join(', ');
        });
        if (backend) backend.saveBatchImageTags(JSON.stringify(updates));
        renderActiveTags();
        renderGlobalTagsList();
        renderGrid();
    }

    function applyKeywordsToAll() {
        if (!keywordsInput) return;
        const keywordsStr = keywordsInput.value.trim();
        const rawKeywords = keywordsStr.split(',').map(k => k.trim().toLowerCase()).filter(k => k.length > 0);
        if (rawKeywords.length === 0 || datasetImages.length === 0) return;

        pushUndoState();
        const updates = {};
        datasetImages.forEach(img => {
            const remainingTags = img.tags.filter(t => !rawKeywords.includes(t.toLowerCase()));
            img.tags = [...rawKeywords, ...remainingTags];
            updates[img.relative_path] = img.tags.join(', ');
        });
        if (backend) backend.saveBatchImageTags(JSON.stringify(updates));
        renderActiveTags();
        renderGlobalTagsList();
        renderGrid();
    }

    function triggerAutoTag() {
        if (selectedImageIndex === null) {
            alert("Please select an image first.");
            return;
        }

        const targets = [selectedImageIndex, ...Array.from(multiSelectedIndices)];
        if (!confirm(`Run Local PyTorch AutoTag for ${targets.length} selected image(s)?`)) return;

        pushUndoState();
        let completed = 0;
        const batchUpdates = {};
        const strategy = currentSettingsData.tag_strategy || "add";

        targets.forEach((idx) => {
            const img = datasetImages[idx];
            if (!img) return;

            if (backend && typeof backend.autoTagImage === 'function') {
                backend.autoTagImage(img.relative_path, (returnedTagsStr) => {
                    if (returnedTagsStr) {
                        const newTags = returnedTagsStr.split(',').map(t => t.trim()).filter(t => t.length > 0);
                        const activeKeywords = keywordsInput ? keywordsInput.value.split(',').map(k => k.trim().toLowerCase()).filter(k => k.length > 0) : [];

                        if (strategy === "replace") {
                            img.tags = cleanImageTags([...activeKeywords, ...newTags]);
                        } else {
                            const remainingExisting = img.tags.filter(t => !activeKeywords.includes(t.toLowerCase()));
                            img.tags = cleanImageTags([...activeKeywords, ...newTags, ...remainingExisting]);
                        }
                        batchUpdates[img.relative_path] = img.tags.join(', ');
                    }

                    completed++;
                    if (completed === targets.length) {
                        if (backend && Object.keys(batchUpdates).length > 0) {
                            backend.saveBatchImageTags(JSON.stringify(batchUpdates));
                        }
                        renderActiveTags();
                        renderGlobalTagsList();
                        renderGrid();
                    }
                });
            }
        });
    }

    const tagInput = document.getElementById('tag-input');
    const autoBox = document.getElementById('autocomplete-box');

    if (tagInput) {
        tagInput.addEventListener('input', function() {
            const val = this.value.trim().toLowerCase();
            if (!val) {
                autoBox.style.display = 'none';
                return;
            }
            const allTags = new Set();
            datasetImages.forEach(img => img.tags.forEach(t => allTags.add(t)));
            const matches = Array.from(allTags).filter(t => t.includes(val) && t !== val).slice(0, 6);
            if (matches.length === 0) {
                autoBox.style.display = 'none';
                return;
            }
            autoBox.innerHTML = '';
            matches.forEach(match => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerText = match;
                div.onclick = () => {
                    tagInput.value = match;
                    autoBox.style.display = 'none';
                    tagInput.focus();
                };
                autoBox.appendChild(div);
            });
            autoBox.style.display = 'block';
        });

        tagInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const val = this.value.trim().toLowerCase();
                if (val) {
                    addTagToSelection(val);
                    this.value = '';
                    autoBox.style.display = 'none';
                }
            } else if (e.key === 'Escape') {
                autoBox.style.display = 'none';
            }
        });
    }

    document.addEventListener('keydown', function(e) {
        const activeInput = document.activeElement === tagInput || document.activeElement === document.getElementById('filter-input') || document.activeElement === keywordsInput;

        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            performRedo();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            performUndo();
            return;
        }
        if ((e.key === 'Delete' || e.key === 'Backspace') && !activeInput && selectedLeftTag) {
            e.preventDefault();
            deleteTagGlobally(selectedLeftTag);
            return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && !activeInput) {
            e.preventDefault();
            selectAllFiltered();
            return;
        }
        if (e.key === 'Escape') {
            document.activeElement.blur();
            selectedLeftTag = null;
            renderGlobalTagsList();
            if (autoBox) autoBox.style.display = 'none';
            clearMultiSelection();
            return;
        }

        if (activeInput || filteredImages.length === 0) return;

        let currentFilteredIdx = filteredImages.findIndex(img => datasetImages.indexOf(img) === selectedImageIndex);
        if (currentFilteredIdx === -1) currentFilteredIdx = 0;

        const gridEl = document.getElementById('image-grid');
        const cols = Math.max(1, Math.floor(gridEl.clientWidth / 216));
        let nextFilteredIdx = currentFilteredIdx;

        if (e.key === 'ArrowRight') nextFilteredIdx = Math.min(filteredImages.length - 1, currentFilteredIdx + 1);
        else if (e.key === 'ArrowLeft') nextFilteredIdx = Math.max(0, currentFilteredIdx - 1);
        else if (e.key === 'ArrowDown') nextFilteredIdx = Math.min(filteredImages.length - 1, currentFilteredIdx + cols);
        else if (e.key === 'ArrowUp') nextFilteredIdx = Math.max(0, currentFilteredIdx - cols);
        else if (e.key === 'Enter') {
            if (tagInput) tagInput.focus();
            e.preventDefault();
            return;
        }

        if (nextFilteredIdx !== currentFilteredIdx) {
            e.preventDefault();
            selectImage(datasetImages.indexOf(filteredImages[nextFilteredIdx]), true);
            const cardNode = gridEl.children[nextFilteredIdx];
            if (cardNode) cardNode.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    });
  </script>
</body>
</html>
